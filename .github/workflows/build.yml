name: Build APK

on:
  workflow_dispatch:
    inputs:
      all_abis:
        description: "Build all ABIs + universal APK (default: arm64-v8a only)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK 36 + extension 19
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-36-ext19" "build-tools;36.0.0" "platform-tools" \
            || "$SDKM" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key (only when the secrets exist)
        env:
          STORE_B64: ${{ secrets.UPLOAD_STORE_BASE64 }}
          STORE_PW: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PW: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$STORE_B64" ]; then
            echo "$STORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            {
              echo "ORG_GRADLE_PROJECT_PDF_TOOLS_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks"
              echo "ORG_GRADLE_PROJECT_PDF_TOOLS_UPLOAD_STORE_PASSWORD=$STORE_PW"
              echo "ORG_GRADLE_PROJECT_PDF_TOOLS_UPLOAD_KEY_ALIAS=$KEY_ALIAS"
              echo "ORG_GRADLE_PROJECT_PDF_TOOLS_UPLOAD_KEY_PASSWORD=$KEY_PW"
            } >> "$GITHUB_ENV"
            echo "Signing with the upload key."
          else
            echo "No upload key secrets: signing with the debug key."
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          if [ "${{ inputs.all_abis }}" = "true" ]; then
            ./gradlew :app:assembleRelease -PallAbis --no-daemon
          else
            ./gradlew :app:assembleRelease --no-daemon
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-tools-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APKs to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app/build/outputs/apk/release/*.apk \
            --title "PDF Tools (bản tiếng Việt) - bản mới nhất" \
            --notes "APK build tự động từ nhánh main, commit ${GITHUB_SHA::7}. Tải app-release.apk (arm64) cho hầu hết điện thoại. APK ký bằng khóa debug, hãy gỡ bản cài khác trước."
